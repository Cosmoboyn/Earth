<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GemeniOS - Игры для Кайфа</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; }
        canvas { display: block; }
        
        /* Стильное меню выбора миров */
        #menu-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        h1 { font-size: 42px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; color: #4e9eff; text-shadow: 0 0 10px rgba(78,158,255,0.5); }
        .grid { display: grid; grid-template-columns: repeat(2, 220px); gap: 20px; }
        .card {
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 20px; text-align: center; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-5px); background: rgba(78,158,255,0.15); border-color: #4e9eff;
            box-shadow: 0 8px 25px rgba(78,158,255,0.4);
        }
        .card h3 { margin: 0 0 10px 0; font-size: 22px; }
        .card p { margin: 0; font-size: 13px; color: #aaa; line-height: 1.4; }
        
        /* Кнопка возврата в меню */
        #back-btn {
            position: absolute; top: 20px; left: 20px; padding: 10px 18px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 8px; cursor: pointer; display: none; z-index: 10;
        }
        #back-btn:hover { background: #ff4a4a; border-color: #ff4a4a; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="back-btn" onclick="goToMenu()">В меню</button>

    <div id="menu-container">
        <h1>Выбери свой мир</h1>
        <div class="grid">
            <div class="card" onclick="startWorld('field')">
                <h3 style="color: #52ff52;">Поляна</h3>
                <p>Чистый кайф. Плавные зелёные холмы и тысячи красивых цветов.</p>
            </div>
            <div class="card" onclick="startWorld('village')">
                <h3 style="color: #ffcc00;">Село</h3>
                <p>Уютные деревянные домики, раскидистые деревья и жители.</p>
            </div>
            <div class="card" onclick="startWorld('city')">
                <h3 style="color: #00ffff;">Город</h3>
                <p>Мегаполис, тротуары. Ночью загораются окна домов и фонари.</p>
            </div>
            <div class="card" onclick="startWorld('moon')">
                <h3 style="color: #dddddd;">Луна</h3>
                <p>Космическая пустыня, звёзды круглые сутки и огромные прыжки!</p>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, currentWorld = null;
        let player, players = {}; // Мультиплеер сохранен!
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let objectsInWorld = [];
        let lightsToToggle = []; // Фонари и окна для города
        let isNight = false;
        let dayNightTimer = 0;

        // Физические настройки миров 4000x4000
        const WORLD_SIZE = 4000;
        let worldSettings = {
            gravity: 30.0,
            jumpForce: 15.0,
            speed: 400.0
        };

        // Инициализация движка
        function initEngine() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Создаем кайфового игрока (Капсула времени со светящимся ядром вместо кубов!)
            const playerGroup = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(1, 1, 3, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4e9eff, roughness: 0.2, metalness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5;
            playerGroup.add(body);

            const coreGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.set(0, 2, 0.8); // Лицо/глаз робота
            playerGroup.add(core);

            player = playerGroup;
            scene.add(player);

            window.addEventListener('resize', onWindowResize);
            setupControls();
            animate();
        }

        // Стильный футуристичный скин для других игроков (Мультиплеер)
        function createRemotePlayerSkin() {
            const group = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4a4a, roughness: 0.1, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5;
            group.add(body);

            // Светящееся кольцо вокруг игрока для стиля
            const ringGeo = new THREE.RingGeometry(1.8, 2, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 1.5;
            group.add(ring);

            return group;
        }

        // Запуск выбранного мира
        function startWorld(type) {
            currentWorld = type;
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';

            if (!scene) initEngine();
            clearCurrentWorld();

            // Сброс позиции игрока в центр огромной карты
            player.position.set(0, 5, 0);
            camera.position.set(0, 3, 7);
            player.add(camera); // Камера за игроком

            // Настройка параметров под мир
            if (type === 'moon') {
                worldSettings.gravity = 8.0;      // Сниженная гравитация для Луны
                worldSettings.jumpForce = 28.0;   // Огромный прыжок
                worldSettings.speed = 300.0;
            } else {
                worldSettings.gravity = 35.0;     // Стандартная земная физика
                worldSettings.jumpForce = 16.0;
                worldSettings.speed = 450.0;
            }

            generateTerrain(type);
        }

        // Очистка карты перед переключением
        function clearCurrentWorld() {
            objectsInWorld.forEach(obj => scene.remove(obj));
            objectsInWorld = [];
            lightsToToggle = [];
            if (scene.fog) scene.fog = null;
        }

        // Генерация миров 4000x4000
        function generateTerrain(type) {
            let groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, 64, 64);
            let groundMat;

            // Глобальное освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, type === 'moon' ? 0.2 : 0.6);
            scene.add(ambientLight);
            objectsInWorld.push(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(500, 1000, 500);
            scene.add(sunLight);
            objectsInWorld.push(sunLight);

            switch(type) {
                case 'field':
                    scene.background = new THREE.Color(0xaaccff);
                    groundMat = new THREE.MeshStandardMaterial({ color: 0x3bb33b, roughness: 0.9 });
                    
                    // Делаем холмы на геометрии
                    let pos = groundGeo.attributes.position;
                    for (let i = 0; i < pos.count; i++) {
                        let vx = pos.getX(i);
                        let vy = pos.getY(i);
                        let z = Math.sin(vx * 0.01) * Math.cos(vy * 0.01) * 15;
                        pos.setZ(i, z);
                    }
                    groundGeo.computeVertexNormals();

                    // Спавним ТОЛЬКО красивые цветы (сферы-соцветия на тонких ножках)
                    for(let i=0; i<1500; i++) {
                        let flower = new THREE.Group();
                        let stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1), new THREE.MeshBasicMaterial({color: 0x228b22}));
                        let bud = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: Math.random() * 0xffffff}));
                        bud.position.y = 0.5;
                        flower.add(stem, bud);
                        flower.position.set(Math.random()*3000 - 1500, 0, Math.random()*3000 - 1500);
                        scene.add(flower);
                        objectsInWorld.push(flower);
                    }
                    break;

                case 'village':
                    scene.background = new THREE.Color(0x87ceeb);
                    groundMat = new THREE.MeshStandardMaterial({ color: 0x557a2b, roughness: 0.9 });
                    
                    // Лес, дома и жители (Стильные закругленные формы вместо кубов)
                    for(let i=0; i<300; i++) {
                        // Дерево нового поколения
                        let tree = new THREE.Group();
                        let trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 5), new THREE.MeshStandardMaterial({color: 0x5c4033}));
                        let leaves = new THREE.Mesh(new THREE.SphereGeometry(2.5, 8, 8), new THREE.MeshStandardMaterial({color: 0x2e5c1e, roughness:0.6}));
                        leaves.position.y = 3;
                        tree.add(trunk, leaves);
                        tree.position.set(Math.random()*3000 - 1500, 0, Math.random()*3000 - 1500);
                        scene.add(tree);
                        objectsInWorld.push(tree);

                        // Уютный круглый домик с конусной крышей
                        if(i < 40) {
                            let house = new THREE.Group();
                            let base = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 6, 12), new THREE.MeshStandardMaterial({color: 0x966f33}));
                            let roof = new THREE.Mesh(new THREE.ConeGeometry(5.5, 4, 12), new THREE.MeshStandardMaterial({color: 0x8b0000}));
                            base.position.y = 3; roof.position.y = 8;
                            house.add(base, roof);
                            house.position.set(Math.random()*2000 - 1000, 0, Math.random()*2000 - 1000);
                            scene.add(house);
                            objectsInWorld.push(house);
                        }
                    }
                    break;

                case 'city':
                    scene.background = new THREE.Color(0x111122);
                    groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 }); // Асфальт
                    scene.fog = new THREE.FogExp2(0x111122, 0.002);

                    // Огромные башни мегаполиса и свет
                    for(let i=0; i<80; i++) {
                        let h = 40 + Math.random() * 80;
                        let buildingGeo = new THREE.BoxGeometry(20, h, 20);
                        let buildingMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.3 });
                        let building = new THREE.Mesh(buildingGeo, buildingMat);
                        building.position.set(Math.random()*2500 - 1250, h/2, Math.random()*2500 - 1250);
                        scene.add(building);
                        objectsInWorld.push(building);

                        // Светящиеся окна на зданиях
                        let winGeo = new THREE.SphereGeometry(0.5, 8, 8);
                        let winMat = new THREE.MeshBasicMaterial({ color: 0x444411 }); // Выключены по дефолту
                        let windowMesh = new THREE.Mesh(winGeo, winMat);
                        windowMesh.position.set(building.position.x, h - 10, building.position.z + 10.1);
                        scene.add(windowMesh);
                        objectsInWorld.push(windowMesh);
                        lightsToToggle.push(windowMesh); // Запомним для ночи
                    }
                    break;

                case 'moon':
                    scene.background = new THREE.Color(0x000000); // Чёрное небо
                    groundMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.8 }); // Серая пыль

                    // Космические звёзды (Круглые сутки)
                    const starsGeo = new THREE.BufferGeometry();
                    const starsCount = 2000;
                    const starPositions = new Float32Array(starsCount * 3);
                    for(let i=0; i<starsCount*3; i+=3) {
                        starPositions[i] = Math.random() * 4000 - 2000;
                        starPositions[i+1] = Math.random() * 1000 + 100;
                        starPositions[i+2] = Math.random() * 4000 - 2000;
                    }
                    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
                    const starField = new THREE.Points(starsGeo, starsMat);
                    scene.add(starField);
                    objectsInWorld.push(starField);
                    break;
            }

            let ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            objectsInWorld.push(ground);
        }

        // Логика мультиплеера (Вызывается из твоих сокетов)
        function onPlayerConnect(id) {
            if (players[id]) return;
            players[id] = createRemotePlayerSkin();
            scene.add(players[id]);
        }

        function onPlayerMove(id, x, y, z, rotY) {
            if (players[id]) {
                players[id].position.set(x, y, z);
                players[id].rotation.y = rotY;
            }
        }

        function onPlayerDisconnect(id) {
            if (players[id]) {
                scene.remove(players[id]);
                delete players[id];
            }
        }

        // Симуляция Дня/Ночи для Города
        function updateEnvironment(delta) {
            if (currentWorld !== 'city') return;
            dayNightTimer += delta;
            
            // Каждые 15 секунд меняем день и ночь
            if (dayNightTimer > 15) {
                isNight = !isNight;
                dayNightTimer = 0;

                lightsToToggle.forEach(light => {
                    // Меняем цвет окон: ночью ярко-жёлтый, днём тёмный
                    light.material.color.setHex(isNight ? 0xffea00 : 0x444411);
                });
                
                scene.background.setHex(isNight ? 0x050510 : 0x111122);
            }
        }

        // Физический игровой цикл
        function animate() {
            requestAnimationFrame(animate);
            if (!currentWorld) return;

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            updateEnvironment(delta);

            // Обработка затухания скорости
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= worldSettings.gravity * delta; // Применение гравитации мира

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * worldSettings.speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * worldSettings.speed * delta;

            player.translateX(-velocity.x * delta);
            player.translateZ(-velocity.z * delta);
            player.position.y += (velocity.y * delta);

            // Физическая коллизия с полом
            if (player.position.y < 0) {
                velocity.y = 0;
                player.position.y = 0;
                canJump = true;
            }

            // Имитация отправки координат в мультиплеер (если сокет подключен)
            // if(socket) socket.emit('move', {x: player.position.x, y: player.position.y, z: player.position.z, rot: player.rotation.y});

            prevTime = time;
            renderer.render(scene, camera);
        }

        // Управление клавиатурой
        function setupControls() {
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        if (canJump === true) velocity.y += worldSettings.jumpForce;
                        canJump = false;
                        break;
                }
            };
            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Вращение мышкой
            document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
            document.addEventListener('click', function () {
                if (currentWorld) document.body.requestPointerLock();
            });

            document.addEventListener('mousemove', function(e) {
                if (document.pointerLockElement === document.body && player) {
                    player.rotation.y -= e.movementX * 0.002;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function goToMenu() {
            currentWorld = null;
            document.exitPointerLock();
            document.getElementById('menu-container').style.display = 'flex';
            document.getElementById('back-btn').style.display = 'none';
        }
    </script>
</body>
</html>
